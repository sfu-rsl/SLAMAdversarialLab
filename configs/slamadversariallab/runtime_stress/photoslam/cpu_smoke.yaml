experiment:
  name: runtime_stress_tum_desk_photoslam_cpu_smoke_podman
  description: >-
    Podman runtime-stress smoke test on TUM freiburg1_desk with Photo-SLAM,
    exercising the CPU stressor (cgroup v2 cpu.max via PodmanCpuController).
    Photo-SLAM mixes a CPU-side ORB-SLAM3 tracker with GPU-side Gaussian
    splatting, so a half-core cap is more likely to bite the tracking
    front-end than for the pure-GPU foundation-model SLAMs. Verifies the CPU
    control applies cleanly inside the podman container and the SLAM
    tolerates the cap.
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 80

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: cpu_half_core
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 60
          controls:
            cpu:
              max_cores: 0.5

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
