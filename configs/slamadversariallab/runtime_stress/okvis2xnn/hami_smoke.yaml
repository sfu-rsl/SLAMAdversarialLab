experiment:
  name: runtime_stress_euroc_okvis2xnn_hami_smoke_podman
  description: >-
    HAMi GPU/VRAM runtime-stress smoke for OKVIS2-X stereo-depth-network mode
    (okvis2x_app_snetwork_synchronous, CUDA LibTorch depth inference) on EuRoC
    V1_01_easy. Applies a loose VRAM cap that the network's CUDA working set
    fits under, verifying the HAMi controller attaches and the cap is visible
    to the LibTorch allocator without changing behavior. Cap sized loosely
    ahead of profiling; tighten toward the measured CUDA working set for a
    breaking-point run (see the vram_sweep config). Requires HAMi libvgpu.so
    (SAL_HAMI_LIB_HOST_PATH or /opt/hami/libvgpu.so).
  seed: 42

dataset:
  type: euroc
  path: ./datasets/euroc/V1_01_easy
  sequence: "V1_01_easy"
  max_frames: 600
  load_stereo: true
  skip_depth: true

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: vram_12gb_loose
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 900
          controls:
            gpu:
              vram_limit_mb: 12288
              sm_limit_percent: 100

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
