experiment:
  name: runtime_stress_euroc_okvis2xnn_gpu_vram_sweep_podman
  description: >-
    HAMi VRAM cap sweep for OKVIS2-X stereo-depth-network mode on EuRoC
    V1_01_easy: 12 GB (loose, expect clean completion; a manual profiling run
    peaked near 8 GB system-wide VRAM) down through 8, 6, and 4 GB to find
    where the LibTorch CUDA working set no longer fits (HAMi Device OOM, run
    fails without a trajectory). Refine around the measured gpu_mem_used_mb
    telemetry from the loose run. Requires HAMi libvgpu.so.
  seed: 42

dataset:
  type: euroc
  path: ./datasets/euroc/V1_01_easy
  sequence: "V1_01_easy"
  max_frames: 600
  load_stereo: true
  skip_depth: true

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: vram_12gb
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 900, controls: {gpu: {vram_limit_mb: 12288, sm_limit_percent: 100}}}
    - name: vram_8gb
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 900, controls: {gpu: {vram_limit_mb: 8192, sm_limit_percent: 100}}}
    - name: vram_6gb
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 900, controls: {gpu: {vram_limit_mb: 6144, sm_limit_percent: 100}}}
    - name: vram_4gb
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 900, controls: {gpu: {vram_limit_mb: 4096, sm_limit_percent: 100}}}

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
