experiment:
  name: runtime_stress_euroc_nitroslam_memory_smoke_podman
  description: >-
    Memory runtime-stress smoke for Nitro-SLAM (EuRoC V1_01_easy stereo-inertial).
    Caps container RAM to 8 GB (cgroup v2 memory.max via podman update) during the
    stress phase. 8 GB is comfortably above Nitro's host-RAM working set, so the
    run completes and the trace confirms the limit was applied. Memory is the most
    likely non-GPU breaking point for Nitro (cgroup OOM-kill); tighten max_mb in a
    follow-up sweep to find it.
  seed: 42

dataset:
  type: euroc
  path: ./datasets/euroc/V1_01_easy
  sequence: "V1_01_easy"
  max_frames: 600
  load_stereo: true
  skip_depth: true

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: mem_8gb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 300
          controls:
            memory:
              max_mb: 8192

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
