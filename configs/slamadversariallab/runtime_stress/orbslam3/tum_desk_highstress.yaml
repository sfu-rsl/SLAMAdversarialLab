experiment:
  name: runtime_stress_tum_desk_orbslam3_highstress
  description: "Higher CPU runtime-stress test on TUM freiburg1_desk with ORB-SLAM3"
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 120

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: cpu_tenth_core_long
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 15
          controls:
            cpu:
              max_cores: 0.1
    - name: cpu_twentieth_core_long
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 15
          controls:
            cpu:
              max_cores: 0.05

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
