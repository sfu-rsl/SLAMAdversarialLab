experiment:
  name: runtime_stress_tum_desk_orbslam3_smoke_podman_1gb
  description: "Podman runtime-stress smoke test on TUM freiburg1_desk with ORB-SLAM3 (1 GB memory cap)"
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 80

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: memory_1gb_smoke
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 8
          controls:
            memory:
              max_mb: 1024

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
