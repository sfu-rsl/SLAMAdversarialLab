experiment:
  name: runtime_stress_tum_desk_orbslam3_memory_breaking_v2
  description: "Memory breaking point sweep v2 (with --memory-swap fix)"
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 80

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: mem_64mb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 300
          controls:
            memory:
              max_mb: 64

    - name: mem_32mb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 300
          controls:
            memory:
              max_mb: 32

    - name: mem_16mb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 300
          controls:
            memory:
              max_mb: 16

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
