experiment:
  name: runtime_stress_tum_desk_orbslam3_breaking_sweep
  description: "Low CPU sweep to find ORB-SLAM3 breaking point on TUM freiburg1_desk"
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 80

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: cpu_0.05_cores
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 300
          controls:
            cpu:
              max_cores: 0.05

    - name: cpu_0.02_cores
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 600
          controls:
            cpu:
              max_cores: 0.02

    - name: cpu_0.01_cores
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 900
          controls:
            cpu:
              max_cores: 0.01

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
