experiment:
  name: runtime_stress_euroc_vggtslam_memory_smoke_podman
  description: >-
    Podman runtime-stress smoke test on EuRoC V1_01_easy with VGGT-SLAM,
    exercising the memory stressor (cgroup v2 memory.max via
    PodmanMemoryController). The 16 GB cap sits above VGGT-SLAM's ~10.4 GB
    host-RAM working set on a 300-frame run (foundation-model encoder +
    accumulated per-frame pointmaps), so the cap is applied to the live
    container's cgroup but never forces an OOM; the SLAM completes and produces
    a trajectory. Verifies the memory control plumbing end to end.
  seed: 42

dataset:
  type: euroc
  sequence: "V1_01_easy"
  path: ./datasets/euroc/V1_01_easy
  max_frames: 300

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: mem_16gb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 120
          controls:
            memory:
              max_mb: 16384

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
