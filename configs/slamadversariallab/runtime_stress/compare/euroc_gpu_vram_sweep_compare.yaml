experiment:
  name: runtime_stress_euroc_gpu_vram_sweep_compare
  description: >-
    GPU/VRAM sweep comparison: ORB-SLAM3 (stereo-inertial, non-CUDA) vs Nitro-SLAM
    (stereo-inertial, CUDA+Vulkan) on EuRoC V1_01_easy, same dataset/sequence/
    frames/sensor mode. HAMi caps the CUDA-driver-API VRAM to 8/4/3/2 GB. Run BOTH:
      SAL_HAMI_LIB_HOST_PATH=$PWD/checkpoints/hami/libvgpu.so \
      python -m src.cli evaluate <this> --slam orbslam3i nitroslam --mode runtime-stress
    Expected: ORB-SLAM3 (no GPU allocations) is immune - completes at every cap;
    Nitro completes at 8/4/3 GB and OOMs at 2 GB (HAMi rejects the 2.98 GB
    CudaKeyFrameStorage d_keyframes alloc). The contrast is the result: GPU
    acceleration introduces a VRAM failure mode the CPU baseline does not have.
    (HAMi governs only the ~3 GB CUDA slice of Nitro's ~11 GB physical VRAM; the
    rest is Vulkan/Kompute + context.)
  seed: 42

dataset:
  type: euroc
  path: ./datasets/euroc/V1_01_easy
  sequence: "V1_01_easy"
  max_frames: 600
  load_stereo: true
  skip_depth: true

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: gpu_vram_8gb
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 600, controls: {gpu: {vram_limit_mb: 8192, sm_limit_percent: 100}}}
    - name: gpu_vram_4gb
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 600, controls: {gpu: {vram_limit_mb: 4096, sm_limit_percent: 100}}}
    - name: gpu_vram_3gb
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 600, controls: {gpu: {vram_limit_mb: 3072, sm_limit_percent: 100}}}
    - name: gpu_vram_2gb
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 600, controls: {gpu: {vram_limit_mb: 2048, sm_limit_percent: 100}}}

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
