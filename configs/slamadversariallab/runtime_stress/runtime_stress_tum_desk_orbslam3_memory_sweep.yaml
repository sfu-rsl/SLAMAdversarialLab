experiment:
  name: runtime_stress_tum_desk_orbslam3_memory_sweep
  description: "Memory sweep to find ORB-SLAM3 breaking point on TUM freiburg1_desk"
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 80

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: mem_512mb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 300
          controls:
            memory:
              max_mb: 512

    - name: mem_256mb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 300
          controls:
            memory:
              max_mb: 256

    - name: mem_128mb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 300
          controls:
            memory:
              max_mb: 128

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
