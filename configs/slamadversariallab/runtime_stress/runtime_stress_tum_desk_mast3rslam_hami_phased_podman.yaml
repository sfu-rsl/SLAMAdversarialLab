experiment:
  name: runtime_stress_tum_desk_mast3rslam_hami_phased_podman
  description: >-
    Demonstrates HAMi GPU cap MUTATION across phases for MASt3R-SLAM. The
    container launches with the first non-None phase's cap as the env-var
    seed; GpuHamiController.apply() then writes a new uint64 to limit[0]
    in the bind-mounted cache file at every phase boundary, and HAMi reads
    the new value on the next cuMemAlloc.

    Three phases, all caps loose enough that MASt3R-SLAM completes the run
    and produces a trajectory. MASt3R-SLAM's foundation-model working set
    on an 80-frame TUM mono run is dominated by the ViT-Large MASt3R
    encoder (~1.1 GB FP16) + per-keyframe pointmap buffers; budget caps
    well above that:
      - phase1_loose:           14 GB cap (way above working set)
      - phase2_above_working:   12 GB cap (still loose)
      - phase3_drop:            no cap    (apply() writes 0)

    Compare to the smoke config: this one verifies the runtime-mutation
    pipeline observably changes the cap mid-run, while the trajectory
    still matches baseline. Expect 2-3 ``HAMi runtime mutation: ...
    limit[0]=...`` log lines as evidence the cap is being rewritten.
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 80

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: gpu_phased_survives_mutations
      enabled: true
      phases:
        - name: phase1_loose
          duration_s: 8
          controls:
            gpu:
              vram_limit_mb: 14336    # 14 GB
        - name: phase2_above_working
          duration_s: 8
          controls:
            gpu:
              vram_limit_mb: 12288    # 12 GB
        - name: phase3_drop
          duration_s: 120
          # No gpu controls -> apply() writes 0 to limit[0] (cap dropped)

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
