experiment:
  name: deadline_fps8_kitti_04_gigaslam
  description: >-
    Real-time deadline test on GigaSLAM (KITTI seq 04). GigaSLAM runs a depth
    model + Gaussian-splatting per frame and self-caps near 3 fps, so an 8 fps
    camera deadline outruns it and forces drops: the DeadlineIterator (driving
    the frontend's cur_frame_idx) drops frames whose deadline passed while the
    previous frame was being processed. GigaSLAM keys keyframes by the real
    frame index (kf_indices), so dropped frames give sparser keyframes with no
    remap. The frame loop lives in utils/slam_frontend.py (a spawned process),
    which the wrapper bind-mounts over the image copy via apply_entrypoint_override.
  seed: 42

dataset:
  type: kitti
  sequence: "04"
  max_frames: 150

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: fps8_deadline
      enabled: true
      realtime:
        target_fps: 8
        warmup_frames: 5
        queue_size: 1
        drop_policy: drop_oldest
      phases:
        - name: stress
          duration_s: 1000

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
