experiment:
  name: runtime_stress_euroc_vggtslam_cpu_smoke_podman
  description: >-
    Podman runtime-stress smoke test on EuRoC V1_01_easy with VGGT-SLAM,
    exercising the CPU stressor (cgroup v2 cpu.max via PodmanCpuController).
    VGGT-SLAM is GPU-bound (foundation-model encoder + per-frame pointmap
    inference), so a half-core cap mostly affects the dataloader and Python
    glue rather than the inference hot path. Verifies the CPU control
    applies cleanly inside the podman container and the SLAM tolerates the
    cap; bias on ATE is not expected to be large.
  seed: 42

dataset:
  type: euroc
  sequence: "V1_01_easy"
  path: ./datasets/euroc/V1_01_easy
  max_frames: 300

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: cpu_half_core
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 120
          controls:
            cpu:
              max_cores: 0.5

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
