experiment:
  name: runtime_stress_tum_desk_dpvo_memory_smoke_podman
  description: >-
    Memory runtime-stress smoke for DPVO (TUM freiburg1_desk mono, podman). Applies a loose 6 GB cgroup memory cap; validates the controller attaches and the cap is visible in the stress trace. Tighten below the measured peak rss_bytes from this run for a breaking-point (OOM 137) experiment.
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 300

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: mem_6gb_loose
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 600, controls: {memory: {max_mb: 6144}}}

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
