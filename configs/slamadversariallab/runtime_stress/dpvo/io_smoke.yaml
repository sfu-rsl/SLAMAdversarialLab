experiment:
  name: runtime_stress_tum_desk_dpvo_io_smoke_podman
  description: >-
    IO-bandwidth runtime-stress smoke for DPVO (TUM freiburg1_desk mono, podman). Caps container reads/writes to 10 MB/s (cgroup v2 io.max); the pipeline page-cache evicts the dataset first so reads hit the device. Validates device resolution from io_target_paths and controller attach.
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 300

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: io_10mbps
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 600, controls: {io: {read_bps: 10000000, write_bps: 10000000}}}

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
