experiment:
  name: runtime_stress_tum_desk_dpvo_hami_smoke_podman
  description: >-
    HAMi GPU/VRAM runtime-stress smoke for DPVO (TUM freiburg1_desk mono, podman). Applies a loose 4 GB VRAM cap via libvgpu.so; DPVO is a patch-based deep VO with a small working set, so the hook fires on every allocation without the cap biting and the trajectory completes. Tune the cap against gpu_mem_used_mb telemetry from this run.
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 300

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: vram_4gb_loose
      enabled: true
      phases:
        - {name: warmup, duration_s: 2}
        - {name: stress, duration_s: 600, controls: {gpu: {vram_limit_mb: 4096, sm_limit_percent: 100}}}

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
