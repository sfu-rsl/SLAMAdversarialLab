experiment:
  name: runtime_stress_tum_desk_droidslam_cpu_smoke_podman
  description: >-
    Podman runtime-stress smoke test on TUM freiburg1_desk with DROID-SLAM,
    exercising the CPU stressor (cgroup v2 cpu.max via PodmanCpuController).
    DROID-SLAM is GPU-bound, so a half-core cap mostly affects the dataloader,
    Python glue, and trajectory I/O rather than the bundle-adjustment hot
    path. This config verifies the CPU control applies cleanly inside the
    podman container and the SLAM tolerates the cap; bias on ATE is not
    expected to be large. First CPU config for a non-ORB-SLAM3 SLAM.
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 80

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: cpu_half_core
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 60
          controls:
            cpu:
              max_cores: 0.5

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
