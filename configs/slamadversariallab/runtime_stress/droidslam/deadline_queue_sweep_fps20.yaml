experiment:
  name: deadline_queue_sweep_fps20_droidslam
  description: >-
    Queue-depth sweep on DROID-SLAM at a fixed deadline (TUM
    freiburg1_desk, 500 raw frames / stride=2 -> 250 sampled, target 20 fps).
    20 fps sits just past DROID's compute knee, where a 1-deep buffer
    drops ~1/3 of frames. Each scenario keeps target_fps=20 but deepens
    the bounded FIFO between the simulated camera and the SLAM
    (queue_size 1, 2, 4, 8, 16). A deeper queue absorbs transient
    compute stalls, trading latency for fewer drops. IO held loose at
    100 MB/s so the only stressor is the deadline + queue.
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 500

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 250
  scenarios:
    - name: fps20_queue_1
      enabled: true
      realtime:
        target_fps: 20
        warmup_frames: 5
        queue_size: 1
      phases:
        - name: stress
          duration_s: 300
          controls:
            io:
              read_bps: 100000000
              write_bps: 100000000

    - name: fps20_queue_2
      enabled: true
      realtime:
        target_fps: 20
        warmup_frames: 5
        queue_size: 2
      phases:
        - name: stress
          duration_s: 300
          controls:
            io:
              read_bps: 100000000
              write_bps: 100000000

    - name: fps20_queue_4
      enabled: true
      realtime:
        target_fps: 20
        warmup_frames: 5
        queue_size: 4
      phases:
        - name: stress
          duration_s: 300
          controls:
            io:
              read_bps: 100000000
              write_bps: 100000000

    - name: fps20_queue_8
      enabled: true
      realtime:
        target_fps: 20
        warmup_frames: 5
        queue_size: 8
      phases:
        - name: stress
          duration_s: 300
          controls:
            io:
              read_bps: 100000000
              write_bps: 100000000

    - name: fps20_queue_16
      enabled: true
      realtime:
        target_fps: 20
        warmup_frames: 5
        queue_size: 16
      phases:
        - name: stress
          duration_s: 300
          controls:
            io:
              read_bps: 100000000
              write_bps: 100000000

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
