experiment:
  name: runtime_stress_kitti_04_gigaslam_cpu_smoke_podman
  description: >-
    Podman runtime-stress smoke test on KITTI sequence 04 with GigaSLAM,
    exercising the CPU stressor (cgroup v2 cpu.max via PodmanCpuController).
    GigaSLAM is GPU-bound (UniDepthV2 depth foundation model + hierarchical
    Gaussian splat optimization), so a half-core cap mostly affects the
    dataloader, DPRetrieval CPU side, and trajectory writeback. Verifies the
    CPU control applies cleanly inside the podman container and the SLAM
    tolerates the cap.
  seed: 42

dataset:
  type: kitti
  sequence: "04"
  max_frames: 200

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: cpu_half_core
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 1000
          controls:
            cpu:
              max_cores: 0.5

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
