experiment:
  name: runtime_stress_tum_desk_orbslam3_full_005
  description: "Full sequence 0.05 cores stress test on TUM freiburg1_desk with ORB-SLAM3"
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 400

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: cpu_0.05_cores
      enabled: true
      phases:
        - name: warmup
          duration_s: 5
        - name: stress
          duration_s: 7200
          controls:
            cpu:
              max_cores: 0.05

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
