experiment:
  name: runtime_stress_euroc_vggtslam_hami_sweep_low_podman
  description: >-
    Low-end VRAM sweep for VGGT-SLAM on EuRoC V1_01_easy (300 frames).
    Pins down the floor below which SLAM output becomes corrupt/missing.
    Prior sweep showed 13+ GB produces trajectory identical to baseline
    even when HAMi denies late allocations. This set tests 8/10/11/12
    to find the break.
  seed: 42

dataset:
  type: euroc
  path: ./datasets/euroc/V1_01_easy
  sequence: "V1_01_easy"
  max_frames: 300
  load_stereo: false
  skip_depth: true

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: gpu_vram_8gb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 120
          controls:
            gpu:
              vram_limit_mb: 8192
              sm_limit_percent: 100
    - name: gpu_vram_10gb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 120
          controls:
            gpu:
              vram_limit_mb: 10240
              sm_limit_percent: 100
    - name: gpu_vram_11gb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 120
          controls:
            gpu:
              vram_limit_mb: 11264
              sm_limit_percent: 100
    - name: gpu_vram_12gb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 120
          controls:
            gpu:
              vram_limit_mb: 12288
              sm_limit_percent: 100

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
