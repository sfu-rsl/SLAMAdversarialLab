experiment:
  name: runtime_stress_euroc_okvis2x_cpu_smoke_podman
  description: >-
    CPU runtime-stress smoke for OKVIS2-X visual-inertial (EuRoC V1_01_easy
    stereo-inertial, plain okvis_app_synchronous). Caps the container to 1 CPU
    core (cgroup v2 cpu.max via podman update) during the stress phase.
    Validates that the CPU controller attaches to the OKVIS2-X podman container
    and the cap appears in the stress trace. OKVIS2-X replays the dataset
    offline, so expect wall-time stretch with accuracy largely preserved.
  seed: 42

dataset:
  type: euroc
  path: ./datasets/euroc/V1_01_easy
  sequence: "V1_01_easy"
  max_frames: 600
  load_stereo: true
  skip_depth: true

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: cpu_1core
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 600
          controls:
            cpu:
              max_cores: 1.0

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
