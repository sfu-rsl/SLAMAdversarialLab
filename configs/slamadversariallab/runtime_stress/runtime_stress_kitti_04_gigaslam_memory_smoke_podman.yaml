experiment:
  name: runtime_stress_kitti_04_gigaslam_memory_smoke_podman
  description: >-
    Podman runtime-stress smoke test on KITTI sequence 04 with GigaSLAM,
    exercising the memory stressor (cgroup v2 memory.max via
    PodmanMemoryController). The 6 GB cap sits above GigaSLAM's ~3.3 GB
    host-RAM working set on a 200-frame run, so the cap is applied to the live
    container's cgroup but never forces an OOM; the SLAM completes and produces
    a trajectory. Verifies the memory control plumbing end to end.
  seed: 42

dataset:
  type: kitti
  sequence: "04"
  max_frames: 200

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: mem_6gb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 1000
          controls:
            memory:
              max_mb: 6144

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
