experiment:
  name: runtime_stress_euroc_okvis2x_io_smoke_podman
  description: >-
    IO-bandwidth runtime-stress smoke for OKVIS2-X visual-inertial on EuRoC
    V1_01_easy. Caps container reads/writes to 10 MB/s (cgroup v2 io.max via
    PodmanIoController; the pipeline page-cache evicts the dataset first so
    reads actually hit the device). Validates the IO controller resolves the
    whole-disk device from io_target_paths and attaches. Offline replay
    absorbs the throttle as wall-time stretch.
  seed: 42

dataset:
  type: euroc
  path: ./datasets/euroc/V1_01_easy
  sequence: "V1_01_easy"
  max_frames: 600
  load_stereo: true
  skip_depth: true

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: io_10mbps
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 600
          controls:
            io:
              read_bps: 10000000
              write_bps: 10000000

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
