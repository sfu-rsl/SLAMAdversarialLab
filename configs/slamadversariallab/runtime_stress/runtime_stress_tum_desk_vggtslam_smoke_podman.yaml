experiment:
  name: runtime_stress_tum_desk_vggtslam_smoke_podman
  description: >-
    Unstressed VGGT-SLAM smoke on TUM freiburg1_desk (mono), podman runtime.
    Validates the new TUM mono wrapper path (staging + filename-timestamp
    trajectory conversion) before the C2 block-design campaign. max_frames kept
    small to stay well under VGGT's VRAM envelope.
  seed: 42

dataset:
  type: tum
  sequence: "freiburg1_desk"
  path: ./datasets/TUM/rgbd_dataset_freiburg1_desk
  max_frames: 80

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: nocap
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 3600
          controls: {}

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
