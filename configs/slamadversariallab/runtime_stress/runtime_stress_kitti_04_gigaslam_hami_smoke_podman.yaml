experiment:
  name: runtime_stress_kitti_04_gigaslam_hami_smoke_podman
  description: >-
    Podman runtime-stress smoke test on KITTI sequence 04 with GigaSLAM.
    Exercises the full HAMi GPU plumbing (libvgpu.so LD_PRELOAD +
    CUDA_DEVICE_MEMORY_LIMIT/SM_LIMIT + CDI device injection + per-container
    bind-mounted shared cache file for runtime mutation) against GigaSLAM's
    UniDepthV2 (foundation depth) + Gaussian-splat rendering + sim3solve
    native-CUDA hot path. GigaSLAM loads the UniDepthV2-vitl14 encoder
    (~1.3 GB FP32) plus per-keyframe scaffold Gaussians; the 12 GB cap is
    comfortably above the working set on a 200-frame KITTI mono run, so
    the hook fires on every cuMemAlloc but the cap is never exceeded and
    the trajectory completes. Paired with the phased config to demonstrate
    mid-run cap mutation at phase boundaries. Third foundation-model SLAM
    in the SAL framework (sibling to VGGT-SLAM and MASt3R-SLAM).
  seed: 42

dataset:
  type: kitti
  sequence: "04"
  max_frames: 200

perturbations:
  - name: baseline
    type: none
    enabled: true

runtime_stress:
  enabled: true
  container_runtime: podman
  telemetry:
    sample_period_ms: 500
  scenarios:
    - name: gpu_vram_12gb
      enabled: true
      phases:
        - name: warmup
          duration_s: 2
        - name: stress
          duration_s: 600
          controls:
            gpu:
              vram_limit_mb: 12288
              sm_limit_percent: 100

output:
  base_dir: ./results
  save_images: false
  create_timestamp_dir: false
